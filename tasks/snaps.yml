---
- name: Ensure snapd.socket is enabled and started
  ansible.builtin.systemd:
    name: snapd.socket
    enabled: true
    state: started
  become: true
  ignore_errors: true
  tags: [snapd]

- name: Ensure snap directory exists
  ansible.builtin.file:
    path: /var/lib/snapd/snap
    state: directory
    mode: '0755'
  become: true
  ignore_errors: true
  tags: [snapd]

- name: Create a symlink for snapd
  ansible.builtin.file:
    src: "/var/lib/snapd/snap"
    dest: "/snap"
    state: link
  become: true
  ignore_errors: true
  tags: [snapd]

- name: Wait for snapd system seed to be loaded
  ansible.builtin.command: snap wait system seed.loaded
  become: true
  register: snap_seed_wait
  failed_when: false
  changed_when: false
  ignore_errors: true
  tags: [snapd]

- name: Install Snap packages (Standard)
  block:
    - name: Install Snap packages in batch (Standard)
      community.general.snap:
        name:
          - audacity
          - bitwarden
          - chromium
          - cups
          - digikam
          - firefox
          - freecad
          - gimp
          - gnome-characters
          - inkscape
          - k3b
          - kget
          - node-red
          - nordvpn
          - obs-studio
          - openvino-ai-plugins-gimp
          - postman
          - proton-vpn
          - snap-store
          - steam
          - tailscale
          - telegram-desktop
          - termius-app
      when: enable_snap_apps | default(true) | bool
  rescue:
    - name: Install Snap packages individually (resilient fallback)
      community.general.snap:
        name: "{{ item }}"
      loop:
        - audacity
        - bitwarden
        - chromium
        - cups
        - digikam
        - firefox
        - freecad
        - gimp
        - gnome-characters
        - inkscape
        - k3b
        - kget
        - node-red
        - nordvpn
        - obs-studio
        - openvino-ai-plugins-gimp
        - postman
        - proton-vpn
        - snap-store
        - steam
        - tailscale
        - telegram-desktop
        - termius-app
      ignore_errors: true
      when: enable_snap_apps | default(true) | bool
  tags: [snap_apps]

# - name: Install Snap packages (Ubuntu)
#   snap:
