- name: Create a symlink for snapd
  file:
    src: "/var/lib/snapd/snap"
    dest: "/snap"
    state: link
  
- name: Install Snap packages (Standard)
  snap:
    name:
      - audacity
      - bitwarden
      - chromium
      - cups
      - digikam
      - firefox
      - freecad
      - gimp
      - gnome-characters
      - inkscape
      - k3b
      - kget
      - node-red
      - nordvpn
      - obs-studio
      - openvino-ai-plugins-gimp
      - postman
      - proton-vpn
      - snap-store
      - steam
      - tailscale
      - telegram-desktop
      - termius-app

#- name: Install Snap packages (Ubuntu)
#  snap:
#    name:
#     - microcloud
#      - multipass
#      - lxd
#      - anbox-cloud-appliance

- name: Install Snap packages with --classic flag
  snap:
    classic: yes
    name:
      - antigravity
      - blender
      - code
      - flutter
      - powershell
