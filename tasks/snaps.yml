- name: Install Snap packages with --classic flag
  block:
    - name: Install Snap packages in batch (--classic)
      community.general.snap:
        classic: true
        name:
          - android-studio
          - antigravity
          - blender
          - code
          - flutter
          - powershell
      when: enable_snap_classic | default(true) | bool
  rescue:
    - name: Install Snap packages individually (--classic fallback)
      community.general.snap:
        classic: true
        name: "{{ item }}"
      loop:
        - android-studio
        - antigravity
        - blender
        - code
        - flutter
        - powershell
      ignore_errors: true
      when: enable_snap_classic | default(true) | bool
  tags: [snap_classic]
