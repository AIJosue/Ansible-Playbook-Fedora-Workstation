---
- name: Ensure snapd.socket is enabled and started
  ansible.builtin.systemd:
    name: snapd.socket
    enabled: true
    state: started
  become: true
  tags: [snapd]

- name: Create a symlink for snapd
  ansible.builtin.file:
    src: "/var/lib/snapd/snap"
    dest: "/snap"
    state: link
  become: true
  tags: [snapd]

- name: Install Snap packages (Standard)
  community.general.snap:
    name:
      - audacity
      - bitwarden
      - chromium
      - cups
      - digikam
      - firefox
      - freecad
      - gimp
      - gnome-characters
      - inkscape
      - k3b
      - kget
      - node-red
      - nordvpn
      - obs-studio
      - openvino-ai-plugins-gimp
      - postman
      - proton-vpn
      - snap-store
      - steam
      - tailscale
      - telegram-desktop
      - termius-app
  when: enable_snap_apps | default(true) | bool
  tags: [snap_apps]

# - name: Install Snap packages (Ubuntu)
#   snap:
#     name:
#      - microcloud
#      - multipass
#      - lxd
#      - anbox-cloud-appliance

- name: Install Snap packages with --classic flag
  community.general.snap:
    classic: true
    name:
      - android-studio
      - antigravity
      - blender
      - code
      - flutter
      - powershell
  when: enable_snap_classic | default(true) | bool
  tags: [snap_classic]
