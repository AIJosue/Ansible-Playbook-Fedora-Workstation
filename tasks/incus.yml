---
- name: Deploy Sandboxie VM on Incus
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check if Sandboxie instance exists
      ansible.builtin.command:
        cmd: incus info Sandboxie
      register: instance_check
      changed_when: false
      failed_when: false

    - name: Initialize Sandboxie VM (empty)
      ansible.builtin.command:
        cmd: incus init Sandboxie --vm --empty
      when: instance_check.rc != 0

    - name: Attach custom devices
      ansible.builtin.command:
        cmd: "incus config device add Sandboxie {{ item.name }} {{ item.type }} {{ item.options }}"
      loop:
        - name: rootdisk
          type: disk
          options: "source=/var/lib/libvirt/images/Linux.qcow2"
        - name: eth0
          type: nic
          options: "nictype=bridged parent=br0"
        - name: vga
          type: gpu
          options: ""
      register: device_add
      failed_when: device_add.rc != 0 and 'already exists' not in device_add.stderr
      when: instance_check.rc != 0

    - name: Ensure Sandboxie is started
      ansible.builtin.command:
        cmd: incus start Sandboxie
      register: start_vm
      changed_when: "'The instance is already running' not in start_vm.stderr"
      failed_when: start_vm.rc != 0 and 'already running' not in start_vm.stderr
