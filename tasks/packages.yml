---
- name: Manage workstation packages via DNF
  become: true
  block:
    - name: Remove unwanted default desktop packages
      ansible.builtin.dnf:
        name: "{{ workstation_removed_packages }}"
        state: absent
        autoremove: true

    - name: Install workstation package groups and core software
      ansible.builtin.dnf:
        name: "{{ workstation_package_groups + workstation_core_packages }}"
        state: present
        skip_broken: true
  rescue:
    - name: Handle DNF transaction failure
      ansible.builtin.debug:
        msg: "A DNF package operation encountered an error. Verify repository availability, network connectivity, and transaction locks."
