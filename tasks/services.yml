---
- name: Enable and start system services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  become: true
  loop: "{{ workstation_system_services }}"

- name: Enable and start system sockets
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  become: true
  loop: "{{ workstation_system_sockets }}"
