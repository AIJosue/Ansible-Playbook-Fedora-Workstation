---
- name: Enable and start system services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - libvirtd
    - fail2ban
    - nix-daemon
    - sshd
    - switcheroo-control
    - tailscaled

- name: Enable and start system sockets
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - podman.socket
    - cockpit.socket
    - snapd.socket

- name: Create Docker compatibility symlink for Podman socket
  become: true
  ansible.builtin.file:
    src: /run/podman/podman.sock
    dest: /var/run/docker.sock
    state: link
    force: true

- name: Ensure firewalld service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Configure core workstation services in firewall
  become: true
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - ssh
    - cockpit
    - kdeconnect

- name: Add libvirt bridge virbr0 to trusted firewall zone
  become: true
  ansible.posix.firewalld:
    zone: trusted
    interface: virbr0
    permanent: true
    immediate: true
    state: enabled

- name: Ensure libvirt default network is active and set to autostart
  ansible.builtin.shell: |
    virsh -c qemu:///system net-autostart default || true
    virsh -c qemu:///system net-start default || true
  register: libvirt_net_result
  changed_when: "'started' in libvirt_net_result.stdout or 'autostarted' in libvirt_net_result.stdout"
  become: true

- name: Ensure KVM/QEMU XML directory exists
  ansible.builtin.file:
    path: "{{ xml_dir }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  become: true
  when: xml_dir is defined

- name: Push VM XML definitions to KVM/QEMU directory
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ xml_dir }}/{{ item | basename }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  with_fileglob:
    - "{{ playbook_dir }}/VMs/*.xml"
  become: true
  when: xml_dir is defined

- name: Find VM XML definitions in KVM/QEMU directory
  ansible.builtin.find:
    paths: "{{ xml_dir }}"
    patterns: "*.xml"
  register: kvm_xml_files
  when: xml_dir is defined

- name: Define VMs via virsh
  ansible.builtin.command: "virsh define {{ item.path }}"
  loop: "{{ kvm_xml_files.files | default([]) }}"
  register: virsh_define_result
  changed_when: "'defined' in virsh_define_result.stdout"
  become: true
  when:
    - xml_dir is defined
    - kvm_xml_files.files is defined
