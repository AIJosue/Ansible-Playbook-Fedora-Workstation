---
- name: Ensure required system groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  become: true
  loop:
    - wheel
    - libvirt
    - lxd
    - nordvpn
    - render
    - video

- name: Create users and assign to necessary system groups
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    groups: "{{ item.groups }}"
    append: true # Ensures they are added to these groups without removing them from others
    create_home: true
    shell: /bin/bash # /bin/bash (default), /bin/zsh, /usr/bin/fish
  loop:
    # Current user running the playbook (captures the real user even if running via sudo)
    - { name: "{{ target_user }}", groups: 'wheel,libvirt,lxd,nordvpn,render,video' }
    # Admins get root access (wheel) plus full control over hypervisors, VPN, and GPU compute (render, video)
    - { name: "{{ admin_username | default('admin') }}", groups: 'wheel,libvirt,nordvpn,render,video' }
    # Standard / sandbox users get standard virtualization and GPU access (libvirt, render, video), but no wheel
    - { name: "{{ sandbox_username | default('sandbox') }}", groups: 'libvirt,render,video' }

- name: Ensure Desktop directory exists for user accounts
  ansible.builtin.file:
    path: "/home/{{ item }}/Desktop"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  become: true
  loop: "{{ [sandbox_username | default('sandbox'), admin_username | default('admin'), target_user] | unique }}"
  when: item != 'root'

- name: Deploy interactive setup script to user Desktop
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/Scripts/launcher.sh"
    dest: "/home/{{ item }}/Desktop/launcher.sh"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  become: true
  loop: "{{ [sandbox_username | default('sandbox'), admin_username | default('admin'), target_user] | unique }}"
  when: item != 'root'


