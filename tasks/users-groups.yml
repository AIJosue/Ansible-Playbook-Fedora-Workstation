- name: Ensure required system groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  become: true
  loop:
    - wheel
    - libvirt
    - nordvpn
    - render
    - video

- name: Create users and assign to necessary system groups
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    groups: "{{ item.groups }}"
    append: yes # Ensures they are added to these groups without removing them from others
    create_home: yes
    shell: /bin/bash # /bin/bash (default), /bin/zsh, /usr/bin/fish
  loop:
    # Current user running the playbook (captures the real user even if running via sudo)
    - { name: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}", groups: 'wheel,libvirt,lxd,nordvpn,render,video' }
    # Admins get root access (wheel) plus full control over hypervisors, VPN, and GPU compute (render, video)
    - { name: 'admin', groups: 'wheel,libvirt,nordvpn,render,video' }
    # Standard users get standard virtualization and GPU access (libvirt, render, video), but no wheel
    - { name: 'user', groups: 'libvirt,render,video' }

- name: Ensure Desktop directory exists for user accounts
  ansible.builtin.file:
    path: "/home/{{ item }}/Desktop"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  become: true
  loop:
    - user
    - "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
  when: item != 'root'

- name: Deploy interactive setup script to user Desktop
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/Scripts/setup-user-environment.sh"
    dest: "/home/{{ item }}/Desktop/setup-user-environment.sh"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  become: true
  loop:
    - user
    - "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
  when: item != 'root'

