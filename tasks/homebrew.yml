---
- name: Set Homebrew binary and path variables
  ansible.builtin.set_fact:
    homebrew_bin: "/home/linuxbrew/.linuxbrew/bin/brew"
    homebrew_path: "/home/linuxbrew/.linuxbrew/bin"

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_bin }}"
  register: brew_check

- name: Ensure /home/linuxbrew directory exists with proper permissions
  ansible.builtin.file:
    path: /home/linuxbrew
    state: directory
    owner: "{{ target_user }}"
    mode: '0755'
  become: true
  become_user: root
  ignore_errors: true
  tags: [homebrew, brew]

- name: Install Homebrew (if not already present)
  ansible.builtin.shell: |
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  when:
    - not (brew_check.stat.exists | default(false))
    - target_user != 'root'
  become: true
  become_user: "{{ target_user }}"
  changed_when: not (brew_check.stat.exists | default(false))
  failed_when: false
  ignore_errors: true

- name: Configure system-wide Homebrew shell environment in profile.d
  ansible.builtin.copy:
    dest: /etc/profile.d/homebrew.sh
    content: |
      # Set up Homebrew shell environment
      if [ -x "/home/linuxbrew/.linuxbrew/bin/brew" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      fi
    mode: '0644'
    owner: root
    group: root
  become: true
  become_user: root
  ignore_errors: true

- name: Ensure Homebrew shellenv is loaded in user bashrc
  ansible.builtin.lineinfile:
    path: "{{ target_user_home }}/.bashrc"
    line: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
    state: present
    create: true
    owner: "{{ target_user }}"
    mode: '0644'
  become: true
  become_user: root
  ignore_errors: true
