---
- name: Set Homebrew binary and path variables
  set_fact:
    homebrew_bin: "/home/linuxbrew/.linuxbrew/bin/brew"
    homebrew_path: "/home/linuxbrew/.linuxbrew/bin"

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_bin }}"
  register: brew_check

- name: Install Homebrew (if not already present)
  ansible.builtin.shell: |
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  when: not brew_check.stat.exists
  become: false # Critical: Homebrew must be installed as a regular user

- name: Configure system-wide Homebrew shell environment in profile.d
  ansible.builtin.copy:
    dest: /etc/profile.d/homebrew.sh
    content: |
      # Set up Homebrew shell environment
      if [ -x "/home/linuxbrew/.linuxbrew/bin/brew" ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
      fi
    mode: '0644'
    owner: root
    group: root
  become: true
  become_user: root

- name: Ensure Homebrew shellenv is loaded in user bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
    state: present
    create: yes
  become: false

