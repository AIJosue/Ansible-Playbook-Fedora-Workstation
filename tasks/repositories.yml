---
- name: Configure third-party YUM/DNF repositories
  become: true
  notify: "refresh dnf cache"
  block:
    - name: Add Google Chrome repository
      ansible.builtin.yum_repository:
        name: google-chrome
        description: google-chrome
        baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
        gpgcheck: true
        gpgkey: https://dl.google.com/linux/linux_signing_key.pub
        enabled: true

    - name: Add Microsoft Edge repository
      ansible.builtin.yum_repository:
        name: microsoft-edge
        description: microsoft-edge
        baseurl: https://packages.microsoft.com/yumrepos/edge
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc
        enabled: true

    - name: Add Microsoft Production repository
      ansible.builtin.yum_repository:
        name: packages-microsoft-com-prod
        description: Microsoft Production
        baseurl: https://packages.microsoft.com/fedora/$releasever/prod/
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc
        enabled: true

    - name: Add Microsoft Teams repository
      ansible.builtin.yum_repository:
        name: ms-teams-yum
        description: ms-teams-yum
        baseurl: https://packages.microsoft.com/yumrepos/ms-teams/
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/yumrepos/ms-teams/repodata/repomd.xml.key
        enabled: true

    - name: Add ProtonVPN Stable repository
      ansible.builtin.yum_repository:
        name: protonvpn-fedora-stable
        description: ProtonVPN Fedora Stable repository
        baseurl: https://repo.protonvpn.com/fedora-$releasever-stable
        gpgcheck: true
        gpgkey: https://repo.protonvpn.com/fedora-$releasever-stable/public_key.asc
        enabled: true

    - name: Add VS Code repository
      ansible.builtin.yum_repository:
        name: vscode-yum
        description: vscode-yum
        baseurl: https://packages.microsoft.com/yumrepos/vscode/
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/yumrepos/vscode/repodata/repomd.xml.key
        enabled: true

    - name: Add RPM Fusion Nonfree - NVIDIA Driver repository
      ansible.builtin.yum_repository:
        name: rpmfusion-nonfree-nvidia-driver
        description: RPM Fusion for Fedora $releasever - Nonfree - NVIDIA Driver
        metalink: https://mirrors.rpmfusion.org/metalink?repo=nonfree-fedora-nvidia-driver-$releasever&arch=$basearch
        gpgcheck: true
        repo_gpgcheck: false
        gpgkey: file:///usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-$releasever
        skip_if_unavailable: true
        enabled: true

    - name: Add RPM Fusion Nonfree - Steam repository
      ansible.builtin.yum_repository:
        name: rpmfusion-nonfree-steam
        description: RPM Fusion for Fedora $releasever - Nonfree - Steam
        metalink: https://mirrors.rpmfusion.org/metalink?repo=nonfree-fedora-steam-$releasever&arch=$basearch
        gpgcheck: true
        repo_gpgcheck: false
        gpgkey: file:///usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-$releasever
        skip_if_unavailable: true
        enabled: true

    - name: Add PyCharm COPR repository
      ansible.builtin.yum_repository:
        name: "copr:copr.fedorainfracloud.org:phracek:PyCharm"
        description: Copr repo for PyCharm owned by phracek
        baseurl: https://download.copr.fedorainfracloud.org/results/phracek/PyCharm/fedora-$releasever-$basearch/
        gpgcheck: true
        gpgkey: https://download.copr.fedorainfracloud.org/results/phracek/PyCharm/pubkey.gpg
        repo_gpgcheck: false
        skip_if_unavailable: true
        enabled: true

    - name: Add Hashicorp Stable repository
      ansible.builtin.yum_repository:
        name: hashicorp
        description: Hashicorp Stable - $basearch
        baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable
        gpgcheck: true
        gpgkey: https://rpm.releases.hashicorp.com/gpg
        enabled: true

    - name: Add Hashicorp Test repository
      ansible.builtin.yum_repository:
        name: hashicorp-test
        description: Hashicorp Test - $basearch
        baseurl: https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/test
        gpgcheck: true
        gpgkey: https://rpm.releases.hashicorp.com/gpg
        enabled: false
