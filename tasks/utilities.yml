---
# --- PIXI (prefix-dev) ---

- name: Ensure Pixi binary directory exists
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.pixi/bin"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: Download and install Pixi binary from GitHub release
  ansible.builtin.unarchive:
    src: "https://github.com/prefix-dev/pixi/releases/latest/download/pixi-{{ 'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}-unknown-linux-musl.tar.gz"
    dest: "/home/{{ target_user }}/.pixi/bin"
    remote_src: true
    creates: "/home/{{ target_user }}/.pixi/bin/pixi"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

# --- FISH SHELL ---

- name: Add fish --no-config to user .bashrc
  ansible.builtin.lineinfile:
    path: "/home/{{ target_user }}/.bashrc"
    regexp: '^fish(\s+--no-config)?$'
    line: 'fish --no-config'
    state: present
    create: true
    backup: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'

# --- TLDR CACHE ---

- name: Ensure TLDR page cache is initialized and up to date
  tldr_cache:
    cache_dir: "/home/{{ target_user }}/.cache/tldr"
    state: present
  become_user: "{{ target_user }}"
