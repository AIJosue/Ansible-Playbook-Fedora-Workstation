---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"
  tags: [init_hostname]

- name: Ensure AppImages directory exists for local user
  ansible.builtin.file:
    path: "{{ target_user_home }}/AppImages"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  become: true
  when: enable_init_appimages_dir | default(true) | bool
  tags: [init_appimages]

- name: Ensure user virtualization directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  loop:
    - "{{ target_user_home }}/Platforms"
    - "{{ target_user_home }}/Platforms/Virtualization"
    - "{{ xml_dir }}"
    - "{{ vagrant_dir }}"
  become: true
  when: enable_init_virt_dirs | default(true) | bool
  tags: [init_virt, vagrant, libvirt]

- name: Push VM XML definitions to KVM/QEMU directory
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ xml_dir }}/{{ item | basename }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  with_fileglob:
    - "{{ playbook_dir }}/VMs/*.xml"
  become: true
  when: enable_init_virt_dirs | default(true) | bool
  tags: [init_virt, libvirt]

- name: Ensure Vagrant environment directories exist
  ansible.builtin.file:
    path: "{{ vagrant_dir }}/{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  loop:
    - ubuntu
    - yunohost
  become: true
  when: enable_init_virt_dirs | default(true) | bool
  tags: [init_virt, vagrant]

- name: Push Vagrant environment folders to Vagrant directory
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ vagrant_dir }}/{{ item | dirname | basename }}/{{ item | basename }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  with_fileglob:
    - "{{ playbook_dir }}/Vagrant/*/*"
  become: true
  when: enable_init_virt_dirs | default(true) | bool
  tags: [init_virt, vagrant]
