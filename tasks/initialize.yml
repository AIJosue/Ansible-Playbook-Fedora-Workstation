- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Ensure AppImages directory exists for local user
  ansible.builtin.file:
    path: "{{ ansible_env.HOME | default('/home/' + (ansible_env.SUDO_USER | default('admin'))) }}/AppImages"
    state: directory
    owner: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    group: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    mode: '0755'
  become: true

