---
- name: Configure Fedora Workstation
  hosts: localhost
  connection: local
  become: true
  roles:
    - { role: repositories, when: enable_repositories | bool, tags: [repositories, repos] }
    - { role: update, when: enable_update | bool, tags: [update] }
    - { role: packages, when: enable_packages | bool, tags: [packages] }
    - { role: flatpaks, when: enable_flatpaks | bool, tags: [flatpaks] }
    - { role: snaps, when: enable_snaps | bool, tags: [snaps] }
    - { role: services, when: enable_services | bool, tags: [services] }
    - { role: udev, when: enable_udev | bool, tags: [udev] }
    - { role: waydroid, when: enable_waydroid | bool, tags: [waydroid] }
    - { role: homebrew, when: enable_homebrew | bool, tags: [homebrew, brew] }
    - { role: users_groups, when: enable_users_groups | bool, tags: [users, users_groups] }
    - { role: ujust, when: enable_ujust | bool, tags: [ujust] }
    - { role: initialize, when: enable_initialize | bool, tags: [initialize, init] }
