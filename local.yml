---
- hosts: localhost
  connection: local
  become: true
  vars:
    hostname: "Desktop" # CHANGE THIS: Desired system hostname
    target_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    target_user_home: "{{ '/home/' + (ansible_env.SUDO_USER | default(ansible_env.USER)) if (ansible_env.SUDO_USER | default(ansible_env.USER)) != 'root' else ansible_env.HOME }}"
    xml_dir: "{{ target_user_home }}/virtualization/kvm-qemu"
    vagrant_dir: "{{ target_user_home }}/virtualization/vagrant"

  tasks:
    - name: Configure repositories
      include_tasks: tasks/repositories.yml

    - name: Update system
      include_tasks: tasks/update.yml

    - name: Install packages
      include_tasks: tasks/packages.yml

    - name: Install snaps
      include_tasks: tasks/snaps.yml

    - name: Enable system services
      include_tasks: tasks/services.yml

    - name: Install flatpaks
      include_tasks: tasks/flatpaks.yml

    - name: Install and configure Homebrew #in-progress
      include_tasks: tasks/homebrew.yml
      args:
        apply:
          become: yes
          become_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"

    - name: Configure users and groups
      include_tasks: tasks/users-groups.yml
      
    - name: Initialize system
      include_tasks: tasks/initialize.yml #in-progress
