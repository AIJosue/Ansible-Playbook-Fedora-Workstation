---
enable_flatpak_cli_only: false       # When true, only installs the flatpak binary/package manager without apps/remotes
enable_flatpak_remotes_system: true  # Toggle system-wide Flathub & Fedora Flatpak remote setup
enable_flatpak_apps: true            # Toggle installing the full list of Flathub and Fedora Flatpak applications

flatpak_remotes:
  - name: flathub
    url: https://dl.flathub.org/repo/flathub.flatpakrepo
  - name: fedora
    url: oci+https://registry.fedoraproject.org

