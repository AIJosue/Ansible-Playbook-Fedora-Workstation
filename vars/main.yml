# Snap Packages
workstation_snaps_standard:
  - anbox-cloud-appliance
  - audacity
  - bitwarden
  - chromium
  - digikam
  - firefox
  - freecad
  - gimp
  - gnome-characters
  - inkscape
  - k3b
  - kget
  - lxd
  - microcloud
  - multipass
  - node-red
  - nordvpn
  - obs-studio
  - openvino-ai-plugins-gimp
  - postman
  - proton-mail
  - snap-store
  - steam
  - tailscale
  - telegram-desktop
  - termius-app

workstation_snaps_classic:
