  - krusader
  - ktimer
  - kcron
  - kclock
  - dolphin-plugins
  - ksystemlog
  - kompare
  - nextcloud-client-dolphin
  # Container and Packaging Tools
  - buildah
  - flatpak-builder
  - skopeo
  # Virtualization and Container Infrastructure
  - ansible
  - ansible-collection-community-general
  - gnome-boxes
  - nbdkit
  - 'incus-*'
  - 'libguestfs*'
  - 'podman*'
  - podman-compose
  - podman-docker
  - podman-machine
  - podman-remote
  - podman-tui
  - swtpm
  - qemu-img
  # Web Admin Console
