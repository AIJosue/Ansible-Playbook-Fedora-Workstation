  - 7zip
  - android-tools
  - bleachbit
  - calibre
  - conda
  - corectrl
  - DisplayCAL
  - distrobox
  - fastfetch
  - fish
  - gtk3-devel
  - libva-utils
  - pidgin
  - pidgin-otr
  - snapd
  - strace
  - tldr
  - tmux
  - uv
  - zsh
  # Web Browsers
  - google-chrome-stable
