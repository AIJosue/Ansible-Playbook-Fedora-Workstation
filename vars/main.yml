# AppImages
workstation_appimages_direct:
  - url: 'https://downloader.cursor.sh/linux/appImage/x64'
    dest: 'cursor.appimage'
  - url: 'https://releases.lmstudio.ai/linux/x86/latest/LM_Studio-linux-x86.AppImage'
    dest: 'lmstudio.appimage'

workstation_appimages_github:
  - repo: 'darktable-org/darktable'
    pattern: 'x86_64.*\\.AppImage'
    dest: 'darktable.appimage'
  - repo: 'janhq/jan'
    pattern: 'amd64\\.AppImage'
    dest: 'jan.appimage'
  - repo: 'LostRuins/koboldcpp'
    pattern: 'linux-x64'
    dest: 'koboldcpp-linux-x64'
  - repo: 'LMMS/lmms'
    pattern: 'linux-x86_64\\.AppImage'
    dest: 'lmms.appimage'
  - repo: 'musescore/MuseScore'
    pattern: 'x86_64\\.AppImage'
    dest: 'musescore.appimage'
  - repo: 'barry-ran/QtScrcpy'
    pattern: 'x64.*\\.AppImage'
    dest: 'qtscrcpy.appimage'
  - repo: 'loft-sh/devpod'
    pattern: 'amd64\\.AppImage'
    dest: 'devpod.appimage'

# Firewall Configuration
workstation_firewall_services:
  - ssh
  - cockpit
