  # VPN and Security
  - protonvpn-stable-release
  - proton-vpn-gnome-desktop
  - proton-vpn-cli
  - fail2ban
  - fail2ban-firewalld
  - fail2ban-systemd
  - wireguard-tools
  - nmap-ncat
